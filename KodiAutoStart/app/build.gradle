plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.mp.kodiautostart'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.mp.kodiautostart'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
